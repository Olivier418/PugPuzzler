[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pugpuzzler"
version = "0.1.0"
description = "Finds every solution of a polyform packing puzzle (exact cover, numba-compiled)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
# `X | None` annotations are evaluated at runtime.
requires-python = ">=3.10"
dependencies = [
    # numba compiles classes/kernel.py, the solver's search loop; without it
    # nothing solves. NUMBA_DISABLE_JIT=1 runs that same source as plain Python
    # for debugging, but still needs numba installed for the decorators.
    "numpy>=1.22,<2.6",
    "numba>=0.67",
    # Terminal rendering and progress.
    "colorama",
    "tqdm",
    # plotting/ only (legend_handles needs 3.7+).
    "matplotlib>=3.7",
]

[tool.setuptools.packages.find]
include = ["pugpuzzler*"]
